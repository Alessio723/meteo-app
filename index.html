<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App meteo</title>
  <meta name="description" content="Cerca una città e vedi il meteo attuale e le previsioni dei prossimi giorni.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <main>
    <h1>App meteo</h1>

    <form id="form-ricerca">
      <label for="citta">Città</label>
      <div class="campo">
        <input id="citta" name="citta" type="text" placeholder="Per esempio Roma"
               maxlength="100" autocomplete="off" required>
        <button id="pulsante-cerca" type="submit">Cerca</button>
      </div>
    </form>

    <div id="recenti" class="recenti" hidden></div>

    <p id="messaggio" role="status"></p>
    <section id="risultato" aria-live="polite"></section>
  </main>

  <footer>
    <p>
      Dati meteo di
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
      (licenza CC BY 4.0).
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
